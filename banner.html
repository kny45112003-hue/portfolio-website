<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banner Preview</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #222;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      #banner {
        width: 2560px;
        height: 424px;
        background: #0a0a0a;
        position: relative;
        overflow: hidden;
        transform-origin: top left;
        transform: scale(0.5);
        margin: -106px -640px;
      }

      /* 배경 이미지 콜라주 */
      .bg-img {
        position: absolute;
        object-fit: cover;
        opacity: 0.18;
        filter: grayscale(30%);
      }

      /* 빨간 라인 */
      .red-line {
        position: absolute;
        background: #ff0000;
      }

      /* 메인 타이포 */
      #banner-title {
        position: absolute;
        left: 120px;
        top: 50%;
        transform: translateY(-50%);
        font-family: "Big Shoulders Display", sans-serif;
        font-size: 200px;
        font-weight: 900;
        color: #ffffff;
        line-height: 0.85;
        letter-spacing: -8px;
        z-index: 10;
      }

      #banner-title span {
        color: #ff0000;
      }

      #banner-sub {
        position: absolute;
        left: 120px;
        bottom: 48px;
        font-family: "Big Shoulders Display", sans-serif;
        font-size: 22px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.4);
        letter-spacing: 8px;
        text-transform: uppercase;
        z-index: 10;
      }

      /* 아웃라인 텍스트 */
      #banner-outline {
        position: absolute;
        right: 80px;
        top: 50%;
        transform: translateY(-50%);
        font-family: "Big Shoulders Display", sans-serif;
        font-size: 280px;
        font-weight: 900;
        color: transparent;
        -webkit-text-stroke: 2px rgba(255, 255, 255, 0.06);
        letter-spacing: -10px;
        z-index: 2;
        white-space: nowrap;
      }

      /* 그라디언트 오버레이 */
      #overlay-left {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 600px;
        background: linear-gradient(to right, #0a0a0a 40%, transparent);
        z-index: 5;
      }

      #overlay-right {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: 400px;
        background: linear-gradient(to left, #0a0a0a 20%, transparent);
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <div id="banner">
      <!-- 아웃라인 배경 텍스트 -->
      <div id="banner-outline">DESIGNER</div>

      <!-- 배경 이미지들 (실제 작업물 위치) -->
      <img
        class="bg-img"
        src="assets/image/site2.png"
        style="right: 380px; top: 0; height: 100%; width: 300px"
      />
      <img
        class="bg-img"
        src="assets/image/site1.png"
        style="right: 670px; top: 0; height: 100%; width: 280px"
      />
      <img
        class="bg-img"
        src="assets/image/site3.png"
        style="right: 940px; top: 0; height: 100%; width: 280px"
      />
      <img
        class="bg-img"
        src="assets/image/site4.png"
        style="right: 1200px; top: 0; height: 100%; width: 280px"
      />
      <img
        class="bg-img"
        src="assets/image/instersns1.jpg"
        style="right: 100px; top: 0; height: 100%; width: 300px; opacity: 0.12"
      />

      <!-- 그라디언트 오버레이 -->
      <div id="overlay-left"></div>
      <div id="overlay-right"></div>

      <!-- 빨간 라인 -->
      <div
        class="red-line"
        style="left: 0; bottom: 0; width: 800px; height: 3px"
      ></div>
      <div
        class="red-line"
        style="right: 0; bottom: 0; width: 400px; height: 3px; opacity: 0.4"
      ></div>

      <!-- 메인 타이포 -->
      <div id="banner-title">Kim<br />Na <span>Yeon</span></div>
      <div id="banner-sub">UX/UI Designer · Brand · Service · SNS</div>
    </div>
  </body>
</html>
